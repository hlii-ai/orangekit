<svg viewBox="0 0 1820 1150" role="img" aria-label="The core paths of workflow.graph.json. Work runs left to right and the column is the order. From session start through explore and plan, preparation outputs converge on build, then verify and cross-check. Four hooks hang from a bus below build; the two that block are drawn in the warning colour. Return edges never cross the body — they drop into a dedicated channel under the band and merge back into build. The lower band is the feedback loop, feeding from the lessons log on the right back to the human report on the left.">
